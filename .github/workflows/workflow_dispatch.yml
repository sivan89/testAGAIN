name: 08 - Runners

on:
  workflow_dispatch:

jobs:
  linux-job:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect the Linux runner
        run: |
          echo "OS       : $RUNNER_OS"
          echo "Arch     : $RUNNER_ARCH"
          echo "Home     : $HOME"
          echo "Temp dir : $RUNNER_TEMP"
