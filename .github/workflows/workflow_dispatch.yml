name: 08 - Runners

on:
  workflow_dispatch:

jobs:
  linux-job:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect Linux runner
        run: |
          echo "OS       : $RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
          echo "Arch     : $RUNNER_ARCH" >> "$GITHUB_STEP_SUMMARY"
          echo "Home     : $HOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Temp dir : $RUNNER_TEMP" >> "$GITHUB_STEP_SUMMARY"
